name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # Windows because the project is: it drives a Windows-only AMI utility and
    # two kernel drivers, and the live path needs administrator rights. There
    # is nothing here that would run on another OS.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: py -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run the tests
        # No firmware on a runner and no administrator rights, which is fine:
        # the suite reads a committed synthetic export from tests/fixtures
        # instead of a board, so what runs here is the parsing, the record
        # rewriting, the comparison and the window construction -- the parts a
        # change can break without a bench to notice. Nothing here executes
        # SCEWIN. The Qt tests build widgets offscreen; they set the platform
        # themselves.
        run: py -m unittest discover -s tests -v

      - name: Check the build still packages
        # A missing import does not fail a test; it fails the first time someone
        # runs the EXE. Building here catches that.
        run: |
          py -m pip install --disable-pip-version-check pyinstaller
          py -m PyInstaller --clean -y RochNVRAM.spec

      - uses: actions/upload-artifact@v7
        with:
          # Unsigned, and without scewin/ -- the AMI binaries live beside the
          # executable rather than inside it, so this artifact is a build check
          # rather than something to hand to anyone.
          name: RochNVRAM-unsigned-no-scewin
          path: dist/RochNVRAM.exe
          if-no-files-found: error
